name: Update literature feed

on:
  workflow_dispatch:
  schedule:
    # Monday-Saturday, 08:00 Asia/Shanghai == 00:00 UTC.
    # The Codex reading-card task runs later, after this feed is available.
    - cron: "0 0 * * 1-6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate feed
        run: python scripts/update_papers.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily literature feed"
          file_pattern: "docs/index.html docs/literature.md docs/md/*.md docs/html/*.html data/latest_papers.json data/feed_history.json"
